<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order and Table Booking | StudySip Cafe</title><meta name="description" content="Ask about StudySip Cafe menu prices, place an order or request a study table booking in Braamfontein."><link rel="stylesheet" href="css/Style.css"><script src="Js/site.js" defer></script></head><body><header><h1>Order or Book</h1><nav aria-label="Main navigation"><ul><li><a href="Home.html">Home</a></li><li><a href="About.html">About</a></li><li><a href="Menu.html">Menu</a></li><li><a href="Study.html">Study space</a></li><li><a href="Order.html">Order / Book</a></li><li><a href="Contact.html">Contact</a></li></ul></nav></header><main><h2>How can we help?</h2><p>Send an order or booking request. We’ll follow up by email to confirm details and availability.</p><form data-local-response="enquiry"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required minlength="2" maxlength="80"><label for="student-number">Student number (optional)</label><input id="student-number" name="studentNumber" maxlength="30"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" pattern="[+0-9() -]{7,20}" title="Enter a phone number using 7 to 20 digits, spaces, +, brackets or hyphens." required><label for="request-type">Request type</label><select id="request-type" name="requestType" required><option value="">Choose one</option><option value="food order">Food order</option><option value="booking">Study table booking</option><option value="enquiry">Question about services or prices</option><option value="volunteer">Volunteer or sponsor enquiry</option></select><label for="date-time">Preferred date and time (for orders or bookings)</label><input id="date-time" name="dateTime" type="datetime-local"><label for="details">Order details or enquiry</label><textarea id="details" name="details" required minlength="10" maxlength="1000" placeholder="Items and quantities, booking size, or your question"></textarea><button type="submit">Send request</button><p class="form-message" aria-live="polite"></p></form></main><footer><p>© 2026 StudySip Cafe · Braamfontein, Johannesburg</p></footer></body></html>
